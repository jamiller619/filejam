[package]
name = "filejam-fs-service"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "filejam-fs-service"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = { version = "~5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

[dev-dependencies]
tempfile = "3"
